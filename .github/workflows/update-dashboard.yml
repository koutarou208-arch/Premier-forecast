name: Update crisis dashboard v3

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"
  push:
    branches:
      - main
    paths:
      - "scripts/update_data.py"
      - "data/manual.json"
      - ".github/workflows/update-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: crisis-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python3 -m py_compile scripts/update_data.py

      - name: Refresh v3 market data and history
        run: python3 scripts/update_data.py

      - name: Validate v3 payload
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          h = json.loads(pathlib.Path("data/history.json").read_text())
          assert isinstance(h, list) and h
          latest = pathlib.Path("data/latest.js").read_text()
          m = re.search(r"window.__RISK_DATA__\s*=\s*(\{.*\});\s*$", latest, re.S)
          assert m, "latest.js payload missing"
          payload = json.loads(m.group(1))
          assert payload["version"] == 3
          assert 0 <= payload["coverage_pct"] <= 100
          assert payload["score"] is None or 0 <= payload["score"] <= 100
          assert "breadth" in payload and "methodology" in payload
          print("v3 payload validation OK")
          PY

      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.js data/history.js data/history.json
          git commit -m "Update crisis watch v3 snapshot"
          git push
