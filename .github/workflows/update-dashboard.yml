name: Update crisis dashboard v6

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"
  push:
    branches:
      - main
    paths:
      - "scripts/update_data.py"
      - "scripts/backtest.py"
      - "scripts/train_nn.py"
      - "data/manual.json"
      - "data/backtest_config.json"
      - ".github/workflows/update-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: crisis-dashboard-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install neural-network dependency
        run: python3 -m pip install --disable-pip-version-check --quiet numpy

      - name: Validate Python syntax
        run: |
          python3 -m py_compile scripts/update_data.py
          python3 -m py_compile scripts/backtest.py
          python3 -m py_compile scripts/train_nn.py

      - name: Refresh v6 market data
        run: python3 scripts/update_data.py

      - name: Run walk-forward backtest
        run: python3 scripts/backtest.py

      - name: Train v6 neural early-warning ensemble
        run: python3 scripts/train_nn.py

      - name: Validate v6 payloads
        run: |
          python3 - <<'PY'
          import json, pathlib, re

          latest = pathlib.Path("data/latest.js").read_text()
          m = re.search(r"window.__RISK_DATA__\s*=\s*(\{.*\});\s*$", latest, re.S)
          assert m, "latest.js payload missing"
          payload = json.loads(m.group(1))
          assert payload["version"] == 6
          assert 0 <= payload["coverage_pct"] <= 100
          assert 0 <= payload["market_coverage_pct"] <= 100
          assert payload["score"] is None or 0 <= payload["score"] <= 100
          assert payload["market_score"] is None or 0 <= payload["market_score"] <= 100
          ids = {x["id"] for x in payload["indicators"]}
          assert {"funding_market","banking_stress","leveraged_credit"}.issubset(ids)

          bt = json.loads(pathlib.Path("data/backtest.json").read_text())
          assert bt["version"] == 5
          assert bt["method"]["lookahead"] is False
          assert bt["method"]["market_only"] is True
          assert len(bt["events"]) >= 4
          assert bt["range"]["observations"] > 500
          assert pathlib.Path("data/backtest.js").exists()

          nn = json.loads(pathlib.Path("data/nn_model.json").read_text())
          assert nn["version"] == 6
          assert nn["model_type"] == "MLP ensemble"
          assert nn["ensemble_size"] >= 3
          assert 0 <= nn["current"]["production_nn_score"] <= 100
          assert 0 <= nn["current"]["hybrid_market_score"] <= 100
          assert 0 <= nn["current"]["threshold_score"] <= 100
          assert nn["metrics"]["validation"]["roc_auc"] is not None
          assert nn["metrics"]["test_holdout"]["roc_auc"] is not None
          assert pathlib.Path("data/nn_model.js").exists()
          print("v6 payload + backtest + neural model validation OK")
          PY

      - name: Commit refreshed snapshot and backtest
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.js data/history.js data/history.json data/backtest.js data/backtest.json data/nn_model.js data/nn_model.json
          git commit -m "Update crisis watch v6 snapshot, backtest and neural model"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push race detected; retrying ($attempt/4)"
            sleep $((attempt * 2))
          done
          echo "Failed to push generated v6 data after retries"
          exit 1
