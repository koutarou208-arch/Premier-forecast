name: Update crisis dashboard v2

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: crisis-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh market data and history
        run: python3 scripts/update_data.py

      - name: Validate generated payload
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/history.json")
          assert p.exists()
          h = json.loads(p.read_text())
          assert isinstance(h, list) and len(h) >= 1
          latest = pathlib.Path("data/latest.js").read_text()
          assert "window.__RISK_DATA__" in latest
          print("dashboard payload validation OK")
          PY

      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.js data/history.js data/history.json
          git commit -m "Update crisis watch v2 snapshot"
          git push
